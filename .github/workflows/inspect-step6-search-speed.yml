name: Inspect Step 6 Search Speed

on:
  push:
    branches: [feature/step6-search-speed]
    paths:
      - '.github/workflows/inspect-step6-search-speed.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm production V9.4.50
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 'https://jobbubble-backend-1.onrender.com/health' > /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('status')=='ok', d
          assert d.get('version')=='9.4.50', d
          assert d.get('adzuna')=='enabled', d
          assert d.get('usajobs')=='enabled', d
          assert d.get('themuse')=='enabled', d
          assert d.get('ats')=='enabled', d
          assert d.get('geoapify')=='enabled', d
          print('Production V9.4.50 and all configured providers are enabled')
          PY

      - name: Benchmark cold ATS and all-source searches
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://jobbubble-backend-1.onrender.com/jobs?where=Everett%2C%20WA&radius=25&refined=0&refresh=1'
          : > /tmp/results.txt
          for source in ats all; do
            OUT="/tmp/${source}.json"
            METRICS=$(curl -fsS --max-time 45 -o "$OUT" -w '%{time_starttransfer} %{time_total}' "$BASE&source=$source")
            COUNT=$(python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(len(d.get('jobs',[])), int(bool(d.get('location_refining'))), d.get('cache',''))
          PY
          )
            echo "$source $METRICS $COUNT" | tee -a /tmp/results.txt
          done

          echo '--- cache-hit repeat for all ---' | tee -a /tmp/results.txt
          OUT=/tmp/all-hit.json
          METRICS=$(curl -fsS --max-time 20 -o "$OUT" -w '%{time_starttransfer} %{time_total}' 'https://jobbubble-backend-1.onrender.com/jobs?where=Everett%2C%20WA&radius=25&refined=0&source=all')
          COUNT=$(python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); print(len(d.get('jobs',[])), int(bool(d.get('location_refining'))), d.get('cache',''))
          PY
          )
          echo "all-hit $METRICS $COUNT" | tee -a /tmp/results.txt
          cat /tmp/results.txt

      - name: Validate speed improvement and response compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          lines=open('/tmp/results.txt').read().splitlines()
          rows={}
          for line in lines:
              m=re.match(r'^(ats|all|all-hit)\s+([0-9.]+)\s+([0-9.]+)\s+(\d+)\s+(\d+)\s+(\S+)',line)
              if m:
                  rows[m.group(1)]={
                      'ttfb':float(m.group(2)), 'total':float(m.group(3)),
                      'count':int(m.group(4)), 'refining':int(m.group(5)), 'cache':m.group(6)
                  }
          assert {'ats','all','all-hit'} <= rows.keys(), rows

          # Stable pre-Step-6 production baseline from run 34901504275:
          # ATS 14.737441s, all-source 13.655634s, cache hit 0.157021s.
          # Public ATS endpoints have natural latency variance, so require ATS to be
          # at least 15% faster than its measured baseline. The user-facing all-source
          # path must improve by at least 35%, which still leaves ample variance room.
          ats_baseline=14.737441
          all_baseline=13.655634
          assert rows['ats']['total'] < ats_baseline * 0.85, rows
          assert rows['all']['total'] < all_baseline * 0.65, rows
          assert rows['ats']['count'] > 0, rows
          assert rows['all']['count'] > 0, rows
          assert rows['all-hit']['total'] < 1.0, rows

          ats=json.load(open('/tmp/ats.json'))
          all_data=json.load(open('/tmp/all.json'))
          assert ats.get('source_filter')=='ats', ats
          assert all_data.get('source_filter')=='all', all_data
          assert all(str(j.get('source','')).startswith('ATS/') for j in ats.get('jobs',[])), {j.get('source') for j in ats.get('jobs',[])}

          sources={str(j.get('source','')) for j in all_data.get('jobs',[])}
          expected_direct={'Adzuna','USAJOBS','The Muse'}
          missing=expected_direct-sources
          assert not missing, ('missing provider families',missing,sources)
          assert any(x.startswith('ATS/') for x in sources), ('ATS missing from all-source response',sources)

          required_top={'jobs','count','radius_miles','source_filter','location_refining'}
          assert required_top <= all_data.keys(), all_data.keys()
          for j in all_data.get('jobs',[])[:25]:
              assert 'id' in j and 'title' in j and 'source' in j, j
              assert 'location_approximate' in j, j
              if j.get('location_precision')=='exact':
                  assert j.get('location_approximate') is False, j

          ats_gain=(1-rows['ats']['total']/ats_baseline)*100
          all_gain=(1-rows['all']['total']/all_baseline)*100
          print(f'PASS: ATS improved {ats_gain:.1f}% and all-source improved {all_gain:.1f}% vs measured baseline')
          print('Sources:',sorted(sources))
          PY

      - name: Upload final Step 6 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step6-search-speed-final-v2
          path: |
            /tmp/results.txt
            /tmp/health.json
            /tmp/ats.json
            /tmp/all.json
            /tmp/all-hit.json
          if-no-files-found: ignore
          retention-days: 3
