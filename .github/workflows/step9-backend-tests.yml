name: Backend Unit Tests

on:
  push:
    branches: [main, feature/step9-cleanup-testing]
    paths:
      - 'providers/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/step9-backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'providers/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/step9-backend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
