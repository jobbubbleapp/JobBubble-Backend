name: Materialize JobBubble runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-runtime.yml'
      - 'materialize-runtime.js'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate production server runtime
        run: |
          set -euo pipefail
          node materialize-runtime.js
          node --check server.js
          grep -Fq 'const GEO_CACHE_VERSION = "v2";' server.js
          grep -Fq 'const geoCache = new SmartGeoCache();' server.js
          grep -Fq 'GEO_NEGATIVE_CACHE_TTL_MS = 30 * 60 * 1000' server.js
          grep -Fq 'setTimeout(resolve, 900)' server.js
          grep -Fq 'Promise.allSettled([' server.js
          grep -Fq 'installMaterializedGeoapifyFetchDedupe()' server.js
          grep -Fq 'geo_cache_version: GEO_CACHE_VERSION' server.js
      - name: Make package scripts use native production runtime
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts = p.scripts || {};
          p.scripts.start = 'node server.js';
          p.scripts.check = 'node --check server.js && node --check providers/ats.js && node --check providers/themuse.js';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Commit materialized runtime
        run: |
          set -euo pipefail
          if git diff --quiet -- server.js package.json; then
            echo 'Runtime is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js package.json
          git commit -m 'Materialize GeoCache V2 and fast job responses'
          git push origin HEAD:main
