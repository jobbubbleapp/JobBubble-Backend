name: Integrate V9.4.42 CareerOneStop

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v9.4.42-careeronestop
    paths:
      - '.github/workflows/integrate-v942.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v9.4.42-careeronestop

      - name: Patch server integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()

          if 'const CAREERONESTOP_USER_ID' not in s:
              needle='const USAJOBS_EMAIL = process.env.USAJOBS_EMAIL;\n'
              assert needle in s
              s=s.replace(needle, needle + 'const CAREERONESTOP_USER_ID = process.env.CAREERONESTOP_USER_ID;\nconst CAREERONESTOP_API_TOKEN = process.env.CAREERONESTOP_API_TOKEN;\nconst { fetchCareerOneStopJobs, normalizeCareerOneStopJob } = require("./providers/careeronestop");\n', 1)

          if 'async function fetchCareerOneStop(where, radius, query)' not in s:
              needle='function normalizeSource(value) {'
              assert needle in s
              wrapper='async function fetchCareerOneStop(where, radius, query) {\n  return fetchCareerOneStopJobs({\n    userId: CAREERONESTOP_USER_ID,\n    apiToken: CAREERONESTOP_API_TOKEN,\n    where, radius, query, pageSize: 50, days: 60,\n    signal: AbortSignal.timeout(12000)\n  });\n}\n\n'
              s=s.replace(needle, wrapper+needle, 1)

          old='''function normalizeSource(value) {\n  const x = String(value || "all").trim().toLowerCase();\n  if (x === "adzuna") return "adzuna";\n  if (x === "usajobs" || x === "usa jobs" || x === "usa_jobs") return "usajobs";\n  return "all";\n}'''
          new='''function normalizeSource(value) {\n  const x = String(value || "all").trim().toLowerCase();\n  if (x === "adzuna") return "adzuna";\n  if (x === "usajobs" || x === "usa jobs" || x === "usa_jobs") return "usajobs";\n  if (x === "careeronestop" || x === "career one stop" || x === "career_one_stop" || x === "nlx") return "careeronestop";\n  return "all";\n}'''
          if old in s: s=s.replace(old,new,1)

          task='''  if (source === "all" || source === "careeronestop") {\n    labels.push("CareerOneStop/NLx");\n    tasks.push(fetchCareerOneStop(where, radius, query));\n  }\n'''
          if task not in s:
              needle='''  if (source === "all" || source === "usajobs") {\n    labels.push("USAJOBS");\n    tasks.push(fetchUSAJobs(where, radius, query));\n  }\n'''
              assert needle in s
              s=s.replace(needle,needle+task,1)

          mapping='''    } else if (provider.label === "CareerOneStop/NLx") {\n      normalized.push(...provider.value.map(normalizeCareerOneStopJob));\n    }\n'''
          if mapping not in s:
              needle='''    } else if (provider.label === "USAJOBS") {\n      normalized.push(...provider.value.map((item) => normalizeUSAJobsJob(item, origin)));\n    }\n'''
              assert needle in s
              s=s.replace(needle, needle[:-4] + mapping, 1)

          s=s.replace('version: "9.4.35"','version: "9.4.42"')
          s=s.replace('JobBubble/9.4.35','JobBubble/9.4.42')
          s=s.replace('JobBubble backend V9.4.35','JobBubble backend V9.4.42')
          health='usajobs: USAJOBS_API_KEY && USAJOBS_EMAIL ? "enabled" : "disabled",'
          career='careeronestop: CAREERONESTOP_USER_ID && CAREERONESTOP_API_TOKEN ? "enabled" : "disabled",'
          if health in s and career not in s:
              s=s.replace(health,health+'\n      '+career,1)

          p.write_text(s)
          PY

      - name: Syntax check
        run: node --check server.js && node --check providers/careeronestop.js

      - name: Commit integration
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo 'No integration changes needed.'
            exit 0
          fi
          git config user.name 'JobBubble Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js
          git commit -m 'Wire CareerOneStop into V9.4.42 backend'
          git push origin HEAD:feature/v9.4.42-careeronestop
