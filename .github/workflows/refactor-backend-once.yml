name: Apply backend refactor cleanup

on:
  push:
    branches:
      - refactor/backend-cleanup
    paths:
      - '.github/workflows/refactor-backend-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove dead providers and historical patch machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          def remove_exact(text, label):
              global s
              if text not in s:
                  raise SystemExit(f'Missing expected server cleanup target: {label}')
              s = s.replace(text, '', 1)

          remove_exact('const CAREERONESTOP_USER_ID = process.env.CAREERONESTOP_USER_ID;\n', 'CareerOneStop user id')
          remove_exact('const CAREERONESTOP_API_TOKEN = process.env.CAREERONESTOP_API_TOKEN;\n', 'CareerOneStop api token')
          remove_exact('const { fetchCareerOneStopJobs, normalizeCareerOneStopJob } = require("./providers/careeronestop");\n', 'CareerOneStop require')
          remove_exact('  if (x === "careeronestop" || x === "career one stop" || x === "career_one_stop" || x === "nlx") return "careeronestop";\n', 'CareerOneStop source normalization')
          remove_exact('    } else if (provider.label === "CareerOneStop/NLx") {\n      normalized.push(...provider.value.map(normalizeCareerOneStopJob));\n', 'CareerOneStop normalization branch')
          remove_exact('        careeronestop: "hidden",\n', 'CareerOneStop health entry')
          remove_exact('  console.log("CareerOneStop: hidden from public source selection");\n', 'CareerOneStop startup log')

          patterns = [
              (r'\nasync function fetchCareerOneStop\(where, radius, query\) \{.*?\n\}\n', 'CareerOneStop fetch wrapper'),
              (r'\n  // CareerOneStop is preserved for possible future reactivation, but intentionally\n  // excluded from the public All Sources path\.\n  if \(source === "careeronestop"\) \{.*?\n  \}\n', 'CareerOneStop provider selection block'),
          ]
          for pattern, label in patterns:
              s2, count = re.subn(pattern, '\n', s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, found {count}')
              s = s2

          if 'CareerOneStop' in s or 'careeronestop' in s:
              raise SystemExit('CareerOneStop references remain in server.js')
          if 'careerjet' in s.lower():
              raise SystemExit('Unexpected Careerjet runtime reference remains in server.js')
          p.write_text(s, encoding='utf-8')

          env = Path('.env.example')
          lines = env.read_text(encoding='utf-8').splitlines()
          drop_prefixes = ('CAREERONESTOP_USER_ID=', 'CAREERONESTOP_API_TOKEN=', 'CAREERJET_API_KEY=')
          lines = [line for line in lines if not line.startswith(drop_prefixes)]
          env.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data.setdefault('scripts', {})['check'] = 'node --check server.js && node --check providers/ats.js && node --check providers/themuse.js'
          pkg.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f \
            providers/careerjet.js \
            providers/careeronestop.js \
            scripts/fix_muse_pipeline.py \
            scripts/fix_v944_muse_results.py \
            scripts/patch_v944_muse.py \
            scripts/patch_v945_ats.py \
            .github/workflows/apply-v944-muse.yml \
            .github/workflows/apply-v945-ats.yml \
            .github/workflows/fix-v944-muse-results.yml \
            .github/workflows/integrate-v942.yml \
            .github/workflows/validate-v944-muse-results.yml \
            .github/workflows/validate-v944-muse.yml \
            .github/workflows/verify-muse-fix.yml \
            .github/workflows/validate-v945-ats.yml

          npm run check
          ! grep -RniE 'CareerOneStop|careeronestop|careerjet' server.js providers .env.example package.json
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/refactor-backend-once.yml
          git add -A
          git commit -m "Refactor backend and remove dead provider/migration code"
          git push
