name: Verify directional location integrity

on:
  push:
    branches:
      - fix/location-direction-integrity-v952
    paths:
      - 'location-integrity.js'
      - 'test/location-integrity.test.js'
      - 'scripts/fix-location-direction-integrity.js'
      - '.github/workflows/fix-location-direction-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify helper and regression tests
        run: |
          set -euo pipefail
          node --check location-integrity.js
          node --check test/location-integrity.test.js
          npm test
      - name: Materialize server fix
        run: |
          set -euo pipefail
          node scripts/fix-location-direction-integrity.js
          node --check server.js
          grep -Fq 'version: "9.4.52"' server.js
          grep -Fq 'const GEO_CACHE_VERSION = "v3";' server.js
          grep -Fq 'const WORKPLACE_CACHE_VERSION = "v2";' server.js
          grep -Fq 'geocoderResultMatchesAddress(address, result)' server.js
          grep -Fq 'extractStreetAddressStrict(text)' server.js
          npm test
      - name: Commit materialized server
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server.js; then
            echo 'server.js already materialized'
            exit 0
          fi
          git config user.name 'jobbubbleapp'
          git config user.email 'jobbubbleapp@gmail.com'
          git add server.js
          git commit -m 'Materialize V9.4.52 directional location integrity fix'
          git push origin HEAD:fix/location-direction-integrity-v952
