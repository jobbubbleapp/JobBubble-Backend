name: Apply V9.4.45 ATS integration

on:
  push:
    branches:
      - feature/ats-feeds
    paths:
      - 'scripts/patch_v945_ats.py'
      - '.github/workflows/apply-v945-ats.yml'
      - 'providers/ats.js'
      - '.env.example'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply ATS patch
        run: python3 scripts/patch_v945_ats.py
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check providers/ats.js
      - name: Validate ATS provider exports
        run: |
          node - <<'NODE'
          const ats = require('./providers/ats');
          if (typeof ats.fetchAtsJobs !== 'function') throw new Error('fetchAtsJobs export missing');
          if (typeof ats.getAtsBoards !== 'function') throw new Error('getAtsBoards export missing');
          const boards = ats.getAtsBoards();
          if (!Array.isArray(boards) || boards.length < 1) throw new Error('No ATS employer boards configured');
          for (const board of boards) {
            if (!['greenhouse', 'lever', 'ashby'].includes(board.provider)) throw new Error(`Bad ATS provider: ${board.provider}`);
            if (!board.board || !board.company) throw new Error('Incomplete ATS board configuration');
          }
          console.log(`Validated ${boards.length} ATS employer boards`);
          NODE
      - name: Commit patched backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate public ATS feeds into JobBubble search [skip ci]"
          git push
