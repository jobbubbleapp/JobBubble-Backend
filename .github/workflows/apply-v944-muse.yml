name: Apply V9.4.44 Muse integration

on:
  push:
    paths:
      - 'scripts/patch_v944_muse.py'
      - '.github/workflows/apply-v944-muse.yml'
      - 'providers/themuse.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python3 scripts/patch_v944_muse.py
      - name: Commit patched backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate The Muse and hide CareerOneStop"
          git push
