name: Validate V9.4.44 Muse results

on:
  push:
    paths:
      - '.github/workflows/validate-v944-muse-results.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render auto-deploy
        run: sleep 70
      - name: Check Seattle and Everett Muse results
        run: |
          set -euo pipefail
          for WHERE in 'Seattle%2C%20WA' 'Everett%2C%20WA'; do
            curl -fsS --retry 5 --retry-delay 3 --max-time 60 "https://jobbubble-backend-1.onrender.com/jobs?where=${WHERE}&radius=100&source=themuse&refresh=1" > /tmp/jobs.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/jobs.json'))
          assert 'error' not in d, d
          print('location=', d.get('search_location'), 'count=', d.get('count'), 'refining=', d.get('location_refining'))
          print('sample=', [(j.get('title'),j.get('location')) for j in d.get('jobs',[])[:3]])
          PY
          done
