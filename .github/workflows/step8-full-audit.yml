name: Step 8 Full Backend Audit

on:
  push:
    branches: [step8-full-audit]
    paths:
      - '.github/workflows/step8-full-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Inventory every tracked file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files > /tmp/tracked-files.txt
          count=$(wc -l < /tmp/tracked-files.txt)
          test "$count" -gt 0
          echo "Tracked files: $count"

      - name: Check merge markers NULs and UTF-8 text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, pathlib
          files=[x.decode('utf-8','replace') for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          bad=[]
          text_ext={'.js','.json','.md','.yml','.yaml','.txt','.sh','.py','.xml','.properties','.gradle','.kts','.toml'}
          for f in files:
              p=pathlib.Path(f); b=p.read_bytes()
              if p.suffix.lower() in text_ext or p.name in {'package.json','.gitignore'}:
                  if b'\x00' in b:
                      bad.append(f'NUL byte in text file: {p}'); continue
                  try: s=b.decode('utf-8')
                  except UnicodeDecodeError as e:
                      bad.append(f'Invalid UTF-8: {p}: {e}'); continue
                  for marker in ('<<<<<<< ','>>>>>>> '):
                      if marker in s: bad.append(f'Merge-conflict marker in {p}: {marker.strip()}')
          if bad:
              print('\n'.join(bad)); raise SystemExit(1)
          print(f'PASS: {len(files)} tracked files scanned for text corruption/conflicts')
          PY

      - name: Parse every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            count=$((count+1))
          done < <(git ls-files -z '*.js')
          echo "PASS: node --check on $count JavaScript files"

      - name: Compile every Python file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, py_compile
          files=[x.decode() for x in subprocess.check_output(['git','ls-files','-z','*.py']).split(b'\0') if x]
          for f in files: py_compile.compile(f,doraise=True)
          print(f'PASS: py_compile on {len(files)} Python files')
          PY

      - name: Parse every JSON file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json
          files=[x.decode() for x in subprocess.check_output(['git','ls-files','-z','*.json']).split(b'\0') if x]
          for f in files:
              with open(f,encoding='utf-8') as h: json.load(h)
          print(f'PASS: JSON parsed for {len(files)} files')
          PY

      - name: Parse every YAML workflow or config file
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; files=`git ls-files "*.yml" "*.yaml"`.lines.map(&:strip); files.each{|f| YAML.load_file(f, aliases: true)}; puts "PASS: YAML parsed for #{files.length} files"'

      - name: Check every shell script
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            bash -n "$f"
            count=$((count+1))
          done < <(git ls-files -z '*.sh')
          echo "PASS: bash -n on $count shell files"

      - name: Check file references and duplicate module hazards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('.')
          js=[pathlib.Path(x.decode()) for x in subprocess.check_output(['git','ls-files','-z','*.js']).split(b'\0') if x]
          missing=[]
          for p in js:
              s=p.read_text(encoding='utf-8')
              for m in re.finditer(r'require\(["\'](\./[^"\']+)["\']\)',s):
                  rel=m.group(1); target=(p.parent/rel)
                  choices=[target,target.with_suffix('.js'),target/'index.js']
                  if not any(c.exists() for c in choices): missing.append(f'{p}: missing require {rel}')
          if missing:
              print('\n'.join(missing)); raise SystemExit(1)
          print('PASS: local CommonJS require targets exist')
          PY

      - name: Install backend dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Dependency tree and declared script audit
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all > /tmp/npm-ls.txt 2>&1 || { cat /tmp/npm-ls.txt; exit 1; }
          node - <<'JS'
          const p=require('./package.json');
          if (!p.scripts || !p.scripts.start) throw new Error('package.json missing start script');
          console.log('PASS: package scripts present',p.scripts);
          JS
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.test?0:1)"; then npm test; else echo 'No package test script'; fi

      - name: Runtime module smoke check
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const assert=require('assert');
          const ats=require('./providers/ats');
          const boards=ats.getAtsBoards();
          assert(Array.isArray(boards));
          assert.equal(boards.length,13);
          const seen=new Set();
          for (const b of boards) {
            assert(['greenhouse','lever','ashby'].includes(b.provider));
            assert(b.board && b.company);
            const k=`${b.provider}:${b.board.toLowerCase()}`;
            assert(!seen.has(k),`duplicate ATS board ${k}`); seen.add(k);
          }
          console.log('PASS: ATS module loads, 13 boards validate, no duplicate boards');
          JS

      - name: Scan for suspicious hardcoded secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess
          files=[pathlib.Path(x.decode()) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          pats=[
            re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
            re.compile(r'gh[pousr]_[0-9A-Za-z]{30,}'),
            re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')
          ]
          hits=[]
          for p in files:
              if p.suffix.lower() not in {'.js','.json','.yml','.yaml','.txt','.md','.sh','.py','.env','.properties'}: continue
              try:s=p.read_text(encoding='utf-8')
              except: continue
              for pat in pats:
                  if pat.search(s): hits.append(str(p))
          if hits:
              print('Possible hardcoded secrets:',sorted(set(hits))); raise SystemExit(1)
          print('PASS: no obvious hardcoded API/private-key patterns found')
          PY

      - name: Production API smoke and invariants
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://jobbubble-backend-1.onrender.com'
          curl -fsS --max-time 20 "$BASE/health" -o /tmp/health.json
          curl -fsS --max-time 40 "$BASE/jobs?where=San%20Francisco%2C%20CA&radius=60&source=all&refined=0" -o /tmp/jobs.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); d=json.load(open('/tmp/jobs.json'))
          assert h.get('status')=='ok' and h.get('version')=='9.4.51', h
          assert h.get('ats_boards')==13, h
          jobs=d.get('jobs'); assert isinstance(jobs,list) and jobs, d
          sources={str(x.get('source','')) for x in jobs}
          assert 'Adzuna' in sources and 'USAJOBS' in sources and 'The Muse' in sources and any(s.startswith('ATS/') for s in sources), sources
          ids=[str(x.get('id','')) for x in jobs]; assert all(ids) and len(ids)==len(set(ids)), 'duplicate/empty job IDs in response'
          for j in jobs:
              assert j.get('title'), j
              if j.get('location_precision')=='exact': assert j.get('location_approximate') is False, j
          print(f'PASS: production smoke returned {len(jobs)} unique jobs from expected provider families')
          PY

      - name: Upload backend Step 8 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step8-backend-audit
          path: |
            /tmp/tracked-files.txt
            /tmp/npm-ls.txt
            /tmp/health.json
            /tmp/jobs.json
          if-no-files-found: ignore
          retention-days: 3
