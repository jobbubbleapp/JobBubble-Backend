name: Verify Muse fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_muse_pipeline.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Muse pipeline fix
        run: python3 scripts/fix_muse_pipeline.py
      - name: Syntax and structural checks
        run: |
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text()
          assert s.count('async function resolveMuseAreaLocations(') == 1, 'duplicate resolveMuseAreaLocations definitions remain'
          assert 'fetchSelectedProviders(source, where, radius, query, centerLat, centerLon)' in s
          assert '`${centerLat},${centerLon}`' in s
          assert 'fetchSelectedProviders(source, where, radius, query, origin.latitude, origin.longitude)' in s
          print('PASS: Muse coordinate-aware provider routing is present and duplicate helper is gone')
          PY
      - name: Commit backend fix
        run: |
          if git diff --quiet; then
            echo 'No patch changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server.js
            git commit -m 'Use search coordinates for Muse provider location'
            git push
          fi
      - name: Wait for Render deployment and verify Muse regression
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, sys
          base='https://jobbubble-backend-1.onrender.com'

          def get_jobs(params):
              q=urllib.parse.urlencode(params)
              req=urllib.request.Request(base+'/jobs?'+q,headers={'User-Agent':'JobBubble-Backend-Verification/9.4.52'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          # This is the exact Android GPS/reverse-geocode shape that previously returned
          # only one Muse posting: a full state name plus authoritative coordinates.
          target={
              'where':'Everett, Washington',
              'lat':'47.9780','lon':'-122.2021',
              'radius':'100','source':'themuse','refresh':'1'
          }
          deadline=time.time()+360
          last=None
          while time.time()<deadline:
              try:
                  data=get_jobs(target)
                  last=data
                  jobs=data.get('jobs') or []
                  muse=[j for j in jobs if str(j.get('source','')).lower()=='the muse']
                  valid=[j for j in muse if isinstance(j.get('latitude'),(int,float)) and isinstance(j.get('longitude'),(int,float))]
                  print('Muse Android-shaped response:', 'count=',data.get('count'),'muse=',len(muse),'located=',len(valid),'refining=',data.get('location_refining'))
                  if len(muse)>1 and len(valid)>1:
                      print('PASS: full-state-name + coordinates returns multiple located Muse jobs')
                      break
              except Exception as e:
                  print('Waiting for deployed backend:',repr(e))
              time.sleep(15)
          else:
              print('FAIL: Muse Android-shaped query still did not return multiple located jobs. Last response:', json.dumps(last)[:2500])
              sys.exit(1)

          # Confirm the normal postal-abbreviation form still works too.
          canonical=get_jobs({'where':'Everett, WA','lat':'47.9780','lon':'-122.2021','radius':'100','source':'themuse','refresh':'1'})
          canonical_muse=[j for j in (canonical.get('jobs') or []) if str(j.get('source','')).lower()=='the muse']
          if len(canonical_muse)<2:
              raise SystemExit('FAIL: canonical Everett, WA Muse query regressed')
          print('PASS: canonical Muse query count=',len(canonical_muse))

          # Related-provider smoke checks: ensure coordinate-aware Muse routing did not
          # change Adzuna or USAJOBS request semantics.
          for source in ('adzuna','usajobs'):
              d=get_jobs({'where':'Everett, WA','lat':'47.9780','lon':'-122.2021','radius':'100','source':source,'refresh':'1'})
              if not isinstance(d.get('jobs'),list) or 'count' not in d:
                  raise SystemExit(f'FAIL: {source} response structure regressed')
              print('PASS related provider:',source,'count=',d.get('count'))
          PY
