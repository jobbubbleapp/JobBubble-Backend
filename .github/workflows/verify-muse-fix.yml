name: Verify Muse fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_muse_pipeline.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Muse pipeline fix
        run: python3 scripts/fix_muse_pipeline.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit backend fix
        run: |
          if git diff --quiet; then
            echo 'No patch changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server.js
            git commit -m 'Resolve Muse locations before initial response'
            git push
          fi
      - name: Wait for Render deployment and verify Muse regression
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, sys
          base='https://jobbubble-backend-1.onrender.com'
          # Give Render time to notice and deploy the just-pushed server commit.
          deadline=time.time()+300
          last=None
          while time.time()<deadline:
              try:
                  q=urllib.parse.urlencode({'where':'Everett, WA','radius':'100','source':'themuse','refresh':'1'})
                  with urllib.request.urlopen(base+'/jobs?'+q, timeout=45) as r:
                      data=json.load(r)
                  last=data
                  jobs=data.get('jobs') or []
                  muse=[j for j in jobs if str(j.get('source','')).lower()=='the muse']
                  valid=[j for j in muse if isinstance(j.get('latitude'),(int,float)) and isinstance(j.get('longitude'),(int,float))]
                  print('Muse response:', 'count=',data.get('count'),'muse=',len(muse),'located=',len(valid),'refining=',data.get('location_refining'))
                  if len(muse)>1 and len(valid)>1:
                      print('PASS: original one-job Muse regression is resolved')
                      break
              except Exception as e:
                  print('Waiting:',repr(e))
              time.sleep(15)
          else:
              print('FAIL: Muse still did not return more than one located job. Last response:', json.dumps(last)[:2000])
              sys.exit(1)
          # Related-provider smoke checks: verify endpoints still return structurally valid responses.
          for source in ('adzuna','usajobs'):
              q=urllib.parse.urlencode({'where':'Everett, WA','radius':'100','source':source,'refresh':'1'})
              with urllib.request.urlopen(base+'/jobs?'+q, timeout=45) as r:
                  d=json.load(r)
              if not isinstance(d.get('jobs'),list) or 'count' not in d:
                  raise SystemExit(f'FAIL: {source} response structure regressed')
              print('PASS related provider:',source,'count=',d.get('count'))
          PY
